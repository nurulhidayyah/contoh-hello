spring.application.name=hello

# Metrik untuk Prometheus platform, di /actuator/prometheus.
management.endpoints.web.exposure.include=health,prometheus
# Histogram latensi HTTP, supaya p95 bisa dihitung di Grafana.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Setiap permintaan dijejak (Dev). Tujuannya Jaeger platform: di laptop lewat
# SSH port forwarding ke localhost:4318; di cluster ditimpa environment
# Deployment.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
